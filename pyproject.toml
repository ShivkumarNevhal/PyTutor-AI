[project]
name = "pytutor-ai"
version = "0.1.0"
description = "Enterprise-grade RAG AI Assistant"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
    "langchain>=0.1.15",
    "langchain-community>=0.0.30",
    "langchain-core>=0.1.40",
    "langchain-groq>=0.1.0",
    "langchain-chroma>=0.1.0",
    "langchain-text-splitters>=0.0.1",
    "chromadb>=0.4.24",
    "fastembed>=0.2.0",
    "pypdf>=4.1.0",
    "python-dotenv>=1.0.1",
    "tqdm>=4.66.0"
]

[tool.vercel]
entrypoint = "src.fast_api_backend:app"
